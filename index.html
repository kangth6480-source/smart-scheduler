<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartScheduler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --primary-dark: #3730a3;
      --primary-bg: #eef2ff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-primary: #1e1b4b;
      --text-secondary: #6b7280;
      --bg-base: #f0f4ff;
      --bg-surface: #ffffff;
      --border: #e0e7ff;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(79,70,229,0.08);
      --transition: all 0.2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title span { font-size: 1.4rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: var(--transition);
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text-primary);
    }
    .btn-outline:hover { background: var(--primary-bg); border-color: var(--primary-light); }
    .btn-ghost { background: transparent; color: var(--text-secondary); padding: 6px 10px; }
    .btn-ghost:hover { background: var(--primary-bg); color: var(--primary); }
    .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #059669; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── AI SUMMARY BANNER ── */
    #ai-summary-banner {
      background: linear-gradient(135deg, var(--primary-bg), #e0e7ff);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    #ai-summary-banner.hidden { display: none; }
    .ai-banner-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 1px; }
    .ai-banner-text { flex: 1; font-size: 0.9rem; line-height: 1.6; color: var(--text-primary); white-space: pre-line; }
    .ai-banner-close { background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 1.1rem; padding: 2px 6px; flex-shrink: 0; }
    .ai-banner-close:hover { color: var(--danger); }

    /* ── MAIN LAYOUT ── */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 16px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      align-items: start;
    }

    /* ── PANEL ── */
    #left-panel { display: flex; flex-direction: column; gap: 20px; }
    #right-panel {
      background: var(--bg-surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 16px;
      position: sticky;
      top: 80px;
    }

    /* ── FORM SECTION ── */
    #form-section {
      background: var(--bg-surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .form-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); }
    input, select, textarea {
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.875rem;
      color: var(--text-primary);
      background: var(--bg-surface);
      transition: var(--transition);
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
    }
    textarea { resize: vertical; min-height: 72px; }
    .field-error { font-size: 0.78rem; color: var(--danger); display: none; }
    .field-error.show { display: block; }
    .form-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }

    /* ── LIST SECTION ── */
    #list-section {
      background: var(--bg-surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    /* Tabs */
    .tab-nav {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 14px 18px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      border-bottom: 2.5px solid transparent;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover { color: var(--primary); }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-count {
      background: var(--primary-bg);
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      min-width: 20px;
      text-align: center;
    }
    .tab-btn.active .tab-count { background: var(--primary); color: #fff; }

    /* Filters */
    .filter-bar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .filter-label { font-size: 0.78rem; color: var(--text-secondary); font-weight: 500; }
    .filter-divider { width: 1px; height: 20px; background: var(--border); }
    .filter-chip {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
    }
    .filter-chip:hover { border-color: var(--primary-light); color: var(--primary); background: var(--primary-bg); }
    .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Card list */
    #card-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 80px; }
    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px 20px;
      font-size: 0.9rem;
    }

    /* ── SCHEDULE CARD ── */
    .schedule-card {
      border-radius: var(--radius);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      padding: 14px 16px;
      background: var(--bg-surface);
      transition: var(--transition);
      position: relative;
    }
    .schedule-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
    .schedule-card.priority-high { border-left-color: var(--danger); }
    .schedule-card.priority-medium { border-left-color: var(--warning); }
    .schedule-card.priority-low { border-left-color: var(--success); }
    .schedule-card.completed { opacity: 0.65; }
    .schedule-card.completed .card-title { text-decoration: line-through; color: var(--text-secondary); }

    .card-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .priority-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .badge-high { background: #fee2e2; color: var(--danger); }
    .badge-medium { background: #fef3c7; color: #b45309; }
    .badge-low { background: #d1fae5; color: #065f46; }
    .card-title { font-size: 0.95rem; font-weight: 600; flex: 1; color: var(--text-primary); word-break: break-word; }
    .category-tag { font-size: 0.78rem; color: var(--text-secondary); display: flex; align-items: center; gap: 3px; }

    .card-meta { font-size: 0.8rem; color: var(--text-secondary); display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }

    .card-memo {
      margin: 6px 0;
      font-size: 0.82rem;
    }
    .card-memo summary {
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.78rem;
      user-select: none;
    }
    .card-memo p { margin-top: 6px; color: var(--text-primary); line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

    .ai-rec {
      margin: 6px 0;
      background: var(--primary-bg);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.8rem;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

    /* ── CALENDAR ── */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .cal-title { font-weight: 700; font-size: 1rem; color: var(--text-primary); }
    .cal-nav { background: none; border: 1.5px solid var(--border); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 0.9rem; color: var(--text-secondary); transition: var(--transition); }
    .cal-nav:hover { border-color: var(--primary-light); color: var(--primary); background: var(--primary-bg); }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 4px;
    }
    .cal-weekday { font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); padding: 4px 0; }
    .cal-weekday:first-child { color: #ef4444; }
    .cal-weekday:last-child { color: #4f46e5; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4px 2px 2px;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      min-height: 40px;
      position: relative;
    }
    .cal-cell:hover { background: var(--primary-bg); }
    .cal-cell.other-month .cal-day { color: #c7d2fe; }
    .cal-cell.today .cal-day {
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cal-day { font-size: 0.78rem; font-weight: 500; color: var(--text-primary); line-height: 1; }
    .cal-cell.sunday .cal-day { color: #ef4444; }
    .cal-cell.saturday .cal-day { color: #4f46e5; }
    .cal-cell.today.sunday .cal-day,
    .cal-cell.today.saturday .cal-day { color: #fff; }
    .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; margin-top: 2px; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .dot-work { background: var(--primary); }
    .dot-personal { background: var(--success); }
    .dot-other { background: var(--warning); }

    /* ── MODALS ── */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.hidden { display: none; }
    .modal-box {
      background: var(--bg-surface);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      padding: 28px;
      width: 100%;
      max-width: 440px;
      position: relative;
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 20px; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      background: none; border: none; cursor: pointer;
      font-size: 1.2rem; color: var(--text-secondary);
    }
    .modal-close:hover { color: var(--danger); }
    .settings-info { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 16px; background: var(--primary-bg); padding: 10px 14px; border-radius: 8px; }

    /* ── TOAST ── */
    #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      animation: slideIn 0.3s ease;
      max-width: 320px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    .toast.hide { animation: slideOut 0.3s ease forwards; }

    /* ── SPINNER ── */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    .btn-outline .spinner, .btn-ghost .spinner {
      border-color: rgba(79,70,229,0.25);
      border-top-color: var(--primary);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── HIDDEN ── */
    .hidden { display: none !important; }

    /* ── RESPONSIVE ── */
    @media (max-width: 1023px) {
      main { grid-template-columns: 1fr; }
      #right-panel { order: -1; position: static; }
    }
    @media (max-width: 767px) {
      main { grid-template-columns: 1fr; padding: 12px 8px; gap: 14px; }
      #right-panel { order: 1; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
      header { padding: 0 12px; }
      .header-title { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-title">
    <span>📅</span> SmartScheduler
  </div>
  <button class="btn btn-outline" id="btn-ai-summary">🤖 AI 요약</button>
  <button class="btn btn-ghost" id="btn-settings" title="설정">⚙️ 설정</button>
</header>

<!-- AI SUMMARY BANNER -->
<div id="ai-summary-banner" class="hidden">
  <span class="ai-banner-icon">🤖</span>
  <span class="ai-banner-text" id="ai-banner-text"></span>
  <button class="ai-banner-close" id="btn-close-banner" title="닫기">✕</button>
</div>

<main>
  <!-- LEFT PANEL -->
  <section id="left-panel">
    <!-- FORM SECTION -->
    <div id="form-section">
      <div class="form-title" id="form-title-label">✏️ 새 일정 추가</div>
      <div class="form-grid">
        <div class="form-group full">
          <label for="f-title">제목 <span style="color:var(--danger)">*</span></label>
          <input type="text" id="f-title" placeholder="일정 제목을 입력하세요" maxlength="100" />
          <span class="field-error" id="err-title">제목을 입력해주세요.</span>
        </div>
        <div class="form-group">
          <label for="f-date">날짜 <span style="color:var(--danger)">*</span></label>
          <input type="date" id="f-date" />
          <span class="field-error" id="err-date">날짜를 선택해주세요.</span>
        </div>
        <div class="form-group">
          <label for="f-time">시간</label>
          <input type="time" id="f-time" />
        </div>
        <div class="form-group">
          <label for="f-category">분류</label>
          <select id="f-category">
            <option value="work">💼 업무</option>
            <option value="personal">🏠 개인</option>
            <option value="other">📌 기타</option>
          </select>
        </div>
        <div class="form-group">
          <label for="f-priority">우선순위</label>
          <select id="f-priority">
            <option value="medium">🟡 중간</option>
            <option value="high">🔴 높음</option>
            <option value="low">🟢 낮음</option>
          </select>
        </div>
        <div class="form-group full">
          <label for="f-memo">메모</label>
          <textarea id="f-memo" placeholder="메모를 입력하세요 (선택)"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-outline btn-sm hidden" id="btn-cancel-edit">취소</button>
        <button class="btn btn-primary btn-sm" id="btn-save">+ 일정 추가</button>
      </div>
    </div>

    <!-- LIST SECTION -->
    <div id="list-section">
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="today">오늘 <span class="tab-count" id="cnt-today">0</span></button>
        <button class="tab-btn" data-tab="upcoming">예정 <span class="tab-count" id="cnt-upcoming">0</span></button>
        <button class="tab-btn" data-tab="completed">완료 <span class="tab-count" id="cnt-completed">0</span></button>
      </nav>
      <div class="filter-bar">
        <span class="filter-label">분류</span>
        <button class="filter-chip active" data-filter-cat="all">전체</button>
        <button class="filter-chip" data-filter-cat="work">💼 업무</button>
        <button class="filter-chip" data-filter-cat="personal">🏠 개인</button>
        <button class="filter-chip" data-filter-cat="other">📌 기타</button>
        <div class="filter-divider"></div>
        <span class="filter-label">우선순위</span>
        <button class="filter-chip active" data-filter-pri="all">전체</button>
        <button class="filter-chip" data-filter-pri="high">🔴 높음</button>
        <button class="filter-chip" data-filter-pri="medium">🟡 중간</button>
        <button class="filter-chip" data-filter-pri="low">🟢 낮음</button>
      </div>
      <div id="card-list"></div>
    </div>
  </section>

  <!-- RIGHT PANEL (CALENDAR) -->
  <aside id="right-panel">
    <div class="cal-header">
      <button class="cal-nav" id="cal-prev">&#8249;</button>
      <span class="cal-title" id="cal-title"></span>
      <button class="cal-nav" id="cal-next">&#8250;</button>
    </div>
    <div class="cal-weekdays">
      <div class="cal-weekday">일</div>
      <div class="cal-weekday">월</div>
      <div class="cal-weekday">화</div>
      <div class="cal-weekday">수</div>
      <div class="cal-weekday">목</div>
      <div class="cal-weekday">금</div>
      <div class="cal-weekday">토</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </aside>
</main>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" id="btn-close-settings">✕</button>
    <div class="modal-title">⚙️ API 키 설정</div>
    <div class="settings-info">
      AI 기능을 사용하려면 API 키를 입력하세요.<br>
      키는 브라우저 localStorage에만 저장되며 외부로 전송되지 않습니다.
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label for="s-openrouter">OpenRouter API 키</label>
      <input type="password" id="s-openrouter" placeholder="sk-or-..." />
    </div>
    <div class="form-group">
      <label for="s-openai">OpenAI API 키</label>
      <input type="password" id="s-openai" placeholder="sk-..." />
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="btn-cancel-settings">취소</button>
      <button class="btn btn-primary" id="btn-save-settings">저장</button>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div id="confirm-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">🗑️ 일정 삭제</div>
    <p style="color:var(--text-secondary);font-size:0.9rem;line-height:1.6;">
      이 일정을 삭제하시겠습니까?<br>삭제 후 복구할 수 없습니다.
    </p>
    <div class="modal-footer">
      <button class="btn btn-outline" id="btn-cancel-confirm">취소</button>
      <button class="btn btn-danger" id="btn-confirm-delete">삭제</button>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<script>
/* ═══════════════════════════════════════
   UTILITIES
═══════════════════════════════════════ */
function generateId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function isoNow() { return new Date().toISOString(); }

function showToast(msg, type='success') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<span>${type==='success'?'✓':'✕'}</span>${escapeHtml(msg)}`;
  container.appendChild(el);
  setTimeout(() => {
    el.classList.add('hide');
    el.addEventListener('animationend', () => el.remove());
  }, 2700);
}

/* ═══════════════════════════════════════
   STATE & STORAGE
═══════════════════════════════════════ */
const STORAGE_KEY = 'smartscheduler_data';

const defaultData = {
  schedules: [],
  settings: { openrouterApiKey: '', openaiApiKey: '' }
};

let state = {
  data: JSON.parse(JSON.stringify(defaultData)),
  activeTab: 'today',
  filterCat: 'all',
  filterPri: 'all',
  editingId: null,
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  pendingDeleteId: null
};

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state.data = { ...defaultData, ...parsed };
      if (!Array.isArray(state.data.schedules)) state.data.schedules = [];
      if (!state.data.settings) state.data.settings = { openrouterApiKey: '', openaiApiKey: '' };
    }
  } catch(e) { state.data = JSON.parse(JSON.stringify(defaultData)); }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
}

/* ═══════════════════════════════════════
   AI FUNCTIONS
═══════════════════════════════════════ */
async function callOpenRouter(prompt) {
  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${state.data.settings.openrouterApiKey}`,
      'Content-Type': 'application/json',
      'HTTP-Referer': window.location.href,
      'X-Title': 'SmartScheduler'
    },
    body: JSON.stringify({
      model: 'deepseek/deepseek-v4-flash:free',
      messages: [{ role: 'user', content: prompt }],
      max_tokens: 512,
      temperature: 0.3
    })
  });
  if (!res.ok) throw new Error(`OpenRouter ${res.status}`);
  const data = await res.json();
  return data.choices[0].message.content;
}

async function callOpenAI(prompt) {
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${state.data.settings.openaiApiKey}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      messages: [{ role: 'user', content: prompt }],
      max_tokens: 512,
      temperature: 0.3
    })
  });
  if (!res.ok) throw new Error(`OpenAI ${res.status}`);
  const data = await res.json();
  return data.choices[0].message.content;
}

function localPriorityAnalysis(schedule) {
  const HIGH_KW = ['마감','급함','긴급','deadline','urgent','중요','발표','회의','제출'];
  const LOW_KW  = ['여유','나중에','검토','참고','기타'];
  const text = `${schedule.title} ${schedule.memo||''}`.toLowerCase();
  if (HIGH_KW.some(k => text.includes(k))) return { suggestedPriority:'high', reason:'긴급/중요 키워드 감지', source:'local' };
  if (LOW_KW.some(k => text.includes(k)))  return { suggestedPriority:'low',  reason:'여유 키워드 감지', source:'local' };
  const days = Math.ceil((new Date(schedule.date) - new Date()) / 86400000);
  if (days <= 0) return { suggestedPriority:'high',   reason:'오늘 일정', source:'local' };
  if (days <= 1) return { suggestedPriority:'high',   reason:'내일 일정', source:'local' };
  if (days <= 3) return { suggestedPriority:'medium', reason:'3일 이내', source:'local' };
  return { suggestedPriority:'low', reason:'여유 있는 일정', source:'local' };
}

async function getAIRecommendation(schedule) {
  const prompt = `일정 관리 전문가로서 아래 일정의 우선순위를 추천하세요.\n제목: ${schedule.title}\n날짜: ${schedule.date} ${schedule.time||''}\n분류: ${schedule.category}\n메모: ${schedule.memo||'없음'}\n오늘: ${getTodayStr()}\n\nJSON만 응답: {"suggestedPriority":"high|medium|low","reason":"한국어 2문장 이내"}`;
  if (state.data.settings.openrouterApiKey) {
    try {
      const r = await callOpenRouter(prompt);
      return { ...JSON.parse(r.match(/\{[\s\S]*\}/)[0]), source:'openrouter' };
    } catch(e) {}
  }
  if (state.data.settings.openaiApiKey) {
    try {
      const r = await callOpenAI(prompt);
      return { ...JSON.parse(r.match(/\{[\s\S]*\}/)[0]), source:'openai' };
    } catch(e) {}
  }
  return localPriorityAnalysis(schedule);
}

async function getTodaySummary(schedules) {
  if (!schedules.length) return '오늘 등록된 일정이 없습니다.';
  const list = schedules.map((s,i) => {
    const pri = s.priority==='high'?'높음':s.priority==='medium'?'중간':'낮음';
    return `${i+1}. [${pri}] ${s.title}${s.time?' '+s.time:''}`;
  }).join('\n');
  const prompt = `오늘 일정을 친근하게 3줄 이내로 요약하고 중요한 것을 강조해주세요:\n${list}`;
  if (state.data.settings.openrouterApiKey) {
    try { return await callOpenRouter(prompt); } catch(e) {}
  }
  if (state.data.settings.openaiApiKey) {
    try { return await callOpenAI(prompt); } catch(e) {}
  }
  const high = schedules.filter(s=>s.priority==='high').length;
  return `오늘 총 ${schedules.length}개의 일정이 있습니다.${high>0?' 높은 우선순위 '+high+'개에 먼저 집중하세요.':' 순서대로 차근차근 처리해보세요.'}`;
}

/* ═══════════════════════════════════════
   SCHEDULE HELPERS
═══════════════════════════════════════ */
function getFilteredSchedules() {
  const today = getTodayStr();
  let list = [...state.data.schedules];

  if (state.activeTab === 'today') {
    list = list.filter(s => s.date === today && !s.completed);
  } else if (state.activeTab === 'upcoming') {
    list = list.filter(s => s.date > today && !s.completed);
    list.sort((a,b) => a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||''));
  } else {
    list = list.filter(s => s.completed);
    list.sort((a,b) => b.updatedAt.localeCompare(a.updatedAt));
  }

  if (state.filterCat !== 'all') list = list.filter(s => s.category === state.filterCat);
  if (state.filterPri !== 'all') list = list.filter(s => s.priority === state.filterPri);

  return list;
}

function getTabCounts() {
  const today = getTodayStr();
  const todayCount = state.data.schedules.filter(s => s.date === today && !s.completed).length;
  const upcomingCount = state.data.schedules.filter(s => s.date > today && !s.completed).length;
  const completedCount = state.data.schedules.filter(s => s.completed).length;
  return { todayCount, upcomingCount, completedCount };
}

/* ═══════════════════════════════════════
   RENDER
═══════════════════════════════════════ */
function categoryLabel(cat) {
  if (cat==='work') return '💼 업무';
  if (cat==='personal') return '🏠 개인';
  return '📌 기타';
}
function priorityLabel(pri) {
  if (pri==='high') return '높음';
  if (pri==='medium') return '중간';
  return '낮음';
}
function sourceLabel(src) {
  if (src==='openrouter') return '🤖';
  if (src==='openai') return '🤖';
  return '🔧';
}

function renderCards() {
  const list = getFilteredSchedules();
  const container = document.getElementById('card-list');

  // Update tab counts
  const { todayCount, upcomingCount, completedCount } = getTabCounts();
  document.getElementById('cnt-today').textContent = todayCount;
  document.getElementById('cnt-upcoming').textContent = upcomingCount;
  document.getElementById('cnt-completed').textContent = completedCount;

  if (!list.length) {
    container.innerHTML = '<div class="empty-state">📭 해당하는 일정이 없습니다.</div>';
    return;
  }

  container.innerHTML = list.map(s => {
    const escaped = {
      title: escapeHtml(s.title),
      memo: escapeHtml(s.memo),
      date: escapeHtml(s.date),
      time: escapeHtml(s.time),
      id: escapeHtml(s.id)
    };
    const completedClass = s.completed ? ' completed' : '';
    const memoSection = s.memo
      ? `<details class="card-memo"><summary>메모 보기</summary><p>${escaped.memo}</p></details>`
      : '';
    const aiRec = s.aiRecommendation && s.aiRecommendation.reason
      ? `<div class="ai-rec">${sourceLabel(s.aiRecommendation.source)} <strong>${priorityLabel(s.aiRecommendation.suggestedPriority)}</strong> — ${escapeHtml(s.aiRecommendation.reason)}</div>`
      : '';
    const completeBtn = s.completed
      ? `<button class="btn btn-outline btn-sm" onclick="toggleComplete('${escaped.id}')">↩ 되돌리기</button>`
      : `<button class="btn btn-success btn-sm" onclick="toggleComplete('${escaped.id}')">✓ 완료</button>`;
    const metaTime = s.time ? `<span>⏰ ${escaped.time}</span>` : '';

    return `<article class="schedule-card priority-${escapeHtml(s.priority)}${completedClass}" data-id="${escaped.id}">
  <div class="card-header">
    <span class="priority-badge badge-${escapeHtml(s.priority)}">${priorityLabel(s.priority)}</span>
    <h3 class="card-title">${escaped.title}</h3>
    <span class="category-tag">${categoryLabel(s.category)}</span>
  </div>
  <div class="card-meta">
    <span>📅 ${escaped.date}</span>${metaTime}
  </div>
  ${memoSection}
  ${aiRec}
  <div class="card-actions">
    ${completeBtn}
    <button class="btn btn-outline btn-sm" id="ai-btn-${escaped.id}" onclick="requestAI('${escaped.id}')">🤖 AI추천</button>
    <button class="btn btn-outline btn-sm" onclick="startEdit('${escaped.id}')">✏️ 수정</button>
    <button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="openConfirm('${escaped.id}')">🗑️ 삭제</button>
  </div>
</article>`;
  }).join('');
}

function renderCalendar() {
  const year = state.calYear;
  const month = state.calMonth;
  const today = getTodayStr();

  document.getElementById('cal-title').textContent = `${year}.${String(month+1).padStart(2,'0')}`;

  const first = new Date(year, month, 1);
  const startDay = first.getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();

  // Build date -> categories map
  const dateMap = {};
  state.data.schedules.forEach(s => {
    if (!dateMap[s.date]) dateMap[s.date] = new Set();
    dateMap[s.date].add(s.category);
  });

  let cells = '';
  let totalCells = Math.ceil((startDay + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    let cellDate, dayNum, isCurrentMonth = true;

    if (i < startDay) {
      dayNum = prevDays - startDay + i + 1;
      isCurrentMonth = false;
      const prevMonthDate = new Date(year, month, 0); // last day of prev month
      const py = prevMonthDate.getFullYear();
      const pm = prevMonthDate.getMonth() + 1;
      cellDate = `${py}-${String(pm).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    } else if (i >= startDay + daysInMonth) {
      dayNum = i - startDay - daysInMonth + 1;
      isCurrentMonth = false;
      const nextMonthDate = new Date(year, month + 1, 1);
      const ny = nextMonthDate.getFullYear();
      const nm = nextMonthDate.getMonth() + 1;
      cellDate = `${ny}-${String(nm).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    } else {
      dayNum = i - startDay + 1;
      cellDate = `${year}-${String(month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    }

    const dayOfWeek = i % 7;
    const isToday = cellDate === today;
    const otherClass = !isCurrentMonth ? ' other-month' : '';
    const todayClass = isToday ? ' today' : '';
    const sunClass = dayOfWeek === 0 ? ' sunday' : '';
    const satClass = dayOfWeek === 6 ? ' saturday' : '';

    const cats = dateMap[cellDate];
    let dots = '';
    if (cats && isCurrentMonth) {
      if (cats.has('work')) dots += '<span class="cal-dot dot-work"></span>';
      if (cats.has('personal')) dots += '<span class="cal-dot dot-personal"></span>';
      if (cats.has('other')) dots += '<span class="cal-dot dot-other"></span>';
    }

    cells += `<div class="cal-cell${otherClass}${todayClass}${sunClass}${satClass}" onclick="calCellClick('${cellDate}')">
  <span class="cal-day">${dayNum}</span>
  <div class="cal-dots">${dots}</div>
</div>`;
  }

  document.getElementById('cal-grid').innerHTML = cells;
}

/* ═══════════════════════════════════════
   ACTIONS
═══════════════════════════════════════ */
function resetForm() {
  document.getElementById('f-title').value = '';
  document.getElementById('f-date').value = getTodayStr();
  document.getElementById('f-time').value = '';
  document.getElementById('f-category').value = 'work';
  document.getElementById('f-priority').value = 'medium';
  document.getElementById('f-memo').value = '';
  document.getElementById('err-title').classList.remove('show');
  document.getElementById('err-date').classList.remove('show');
  document.getElementById('btn-save').textContent = '+ 일정 추가';
  document.getElementById('btn-cancel-edit').classList.add('hidden');
  document.getElementById('form-title-label').textContent = '✏️ 새 일정 추가';
  state.editingId = null;
}

function saveSchedule() {
  const title = document.getElementById('f-title').value.trim();
  const date = document.getElementById('f-date').value;
  let valid = true;

  if (!title) {
    document.getElementById('err-title').classList.add('show');
    valid = false;
  } else {
    document.getElementById('err-title').classList.remove('show');
  }
  if (!date) {
    document.getElementById('err-date').classList.add('show');
    valid = false;
  } else {
    document.getElementById('err-date').classList.remove('show');
  }
  if (!valid) return;

  const now = isoNow();
  if (state.editingId) {
    const idx = state.data.schedules.findIndex(s => s.id === state.editingId);
    if (idx !== -1) {
      state.data.schedules[idx] = {
        ...state.data.schedules[idx],
        title,
        date,
        time: document.getElementById('f-time').value,
        category: document.getElementById('f-category').value,
        priority: document.getElementById('f-priority').value,
        memo: document.getElementById('f-memo').value.trim(),
        updatedAt: now
      };
    }
    showToast('일정이 수정되었습니다.');
  } else {
    const newSchedule = {
      id: generateId(),
      title,
      date,
      time: document.getElementById('f-time').value,
      category: document.getElementById('f-category').value,
      priority: document.getElementById('f-priority').value,
      memo: document.getElementById('f-memo').value.trim(),
      completed: false,
      aiRecommendation: { suggestedPriority: null, reason: null, source: null, generatedAt: null },
      createdAt: now,
      updatedAt: now
    };
    state.data.schedules.push(newSchedule);
    showToast('일정이 추가되었습니다.');
  }

  saveData();
  resetForm();
  renderCards();
  renderCalendar();
}

function startEdit(id) {
  const s = state.data.schedules.find(x => x.id === id);
  if (!s) return;

  state.editingId = id;
  document.getElementById('f-title').value = s.title;
  document.getElementById('f-date').value = s.date;
  document.getElementById('f-time').value = s.time || '';
  document.getElementById('f-category').value = s.category;
  document.getElementById('f-priority').value = s.priority;
  document.getElementById('f-memo').value = s.memo || '';
  document.getElementById('btn-save').textContent = '✔ 수정 완료';
  document.getElementById('btn-cancel-edit').classList.remove('hidden');
  document.getElementById('form-title-label').textContent = '✏️ 일정 수정';

  // Scroll to form
  document.getElementById('form-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleComplete(id) {
  const idx = state.data.schedules.findIndex(s => s.id === id);
  if (idx === -1) return;
  state.data.schedules[idx].completed = !state.data.schedules[idx].completed;
  state.data.schedules[idx].updatedAt = isoNow();
  saveData();
  renderCards();
  showToast(state.data.schedules[idx].completed ? '일정을 완료했습니다!' : '일정을 되돌렸습니다.');
}

function openConfirm(id) {
  state.pendingDeleteId = id;
  document.getElementById('confirm-modal').classList.remove('hidden');
}

function deleteSchedule() {
  if (!state.pendingDeleteId) return;
  state.data.schedules = state.data.schedules.filter(s => s.id !== state.pendingDeleteId);
  state.pendingDeleteId = null;
  document.getElementById('confirm-modal').classList.add('hidden');
  saveData();
  renderCards();
  renderCalendar();
  showToast('일정이 삭제되었습니다.', 'error');
}

async function requestAI(id) {
  const s = state.data.schedules.find(x => x.id === id);
  if (!s) return;

  const btn = document.getElementById(`ai-btn-${id}`);
  if (!btn) return;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 분석 중...';

  try {
    const result = await getAIRecommendation(s);
    const idx = state.data.schedules.findIndex(x => x.id === id);
    if (idx !== -1) {
      state.data.schedules[idx].aiRecommendation = {
        ...result,
        generatedAt: isoNow()
      };
      saveData();
    }
    showToast('AI 추천이 완료되었습니다!');
  } catch(e) {
    showToast('AI 추천 실패. 로컬 분석으로 대체합니다.', 'error');
    const local = localPriorityAnalysis(s);
    const idx = state.data.schedules.findIndex(x => x.id === id);
    if (idx !== -1) {
      state.data.schedules[idx].aiRecommendation = { ...local, generatedAt: isoNow() };
      saveData();
    }
  }

  renderCards();
}

async function requestAISummary() {
  const banner = document.getElementById('ai-summary-banner');
  const bannerText = document.getElementById('ai-banner-text');
  const btn = document.getElementById('btn-ai-summary');

  const todaySchedules = state.data.schedules.filter(s => s.date === getTodayStr() && !s.completed);

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 요약 중...';
  bannerText.textContent = '요약을 생성하고 있습니다...';
  banner.classList.remove('hidden');

  try {
    const summary = await getTodaySummary(todaySchedules);
    bannerText.textContent = summary;
  } catch(e) {
    bannerText.textContent = '요약 생성에 실패했습니다.';
  }

  btn.disabled = false;
  btn.innerHTML = '🤖 AI 요약';
}

function calCellClick(dateStr) {
  document.getElementById('f-date').value = dateStr;
  document.getElementById('err-date').classList.remove('show');
  // On mobile, scroll to form
  if (window.innerWidth < 768) {
    document.getElementById('form-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

/* ═══════════════════════════════════════
   EVENT LISTENERS
═══════════════════════════════════════ */
// Save button
document.getElementById('btn-save').addEventListener('click', saveSchedule);

// Cancel edit
document.getElementById('btn-cancel-edit').addEventListener('click', () => {
  resetForm();
});

// Tab buttons
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.activeTab = btn.dataset.tab;
    renderCards();
  });
});

// Category filters
document.querySelectorAll('[data-filter-cat]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('[data-filter-cat]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filterCat = chip.dataset.filterCat;
    renderCards();
  });
});

// Priority filters
document.querySelectorAll('[data-filter-pri]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('[data-filter-pri]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filterPri = chip.dataset.filterPri;
    renderCards();
  });
});

// Calendar nav
document.getElementById('cal-prev').addEventListener('click', () => {
  state.calMonth--;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', () => {
  state.calMonth++;
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  renderCalendar();
});

// AI Summary
document.getElementById('btn-ai-summary').addEventListener('click', requestAISummary);

// Close AI banner
document.getElementById('btn-close-banner').addEventListener('click', () => {
  document.getElementById('ai-summary-banner').classList.add('hidden');
});

// Settings modal
document.getElementById('btn-settings').addEventListener('click', () => {
  document.getElementById('s-openrouter').value = state.data.settings.openrouterApiKey || '';
  document.getElementById('s-openai').value = state.data.settings.openaiApiKey || '';
  document.getElementById('settings-modal').classList.remove('hidden');
});
document.getElementById('btn-close-settings').addEventListener('click', () => {
  document.getElementById('settings-modal').classList.add('hidden');
});
document.getElementById('btn-cancel-settings').addEventListener('click', () => {
  document.getElementById('settings-modal').classList.add('hidden');
});
document.getElementById('btn-save-settings').addEventListener('click', () => {
  state.data.settings.openrouterApiKey = document.getElementById('s-openrouter').value.trim();
  state.data.settings.openaiApiKey = document.getElementById('s-openai').value.trim();
  saveData();
  document.getElementById('settings-modal').classList.add('hidden');
  showToast('설정이 저장되었습니다.');
});
// Close settings modal on backdrop click
document.getElementById('settings-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('settings-modal')) {
    document.getElementById('settings-modal').classList.add('hidden');
  }
});

// Confirm modal
document.getElementById('btn-cancel-confirm').addEventListener('click', () => {
  document.getElementById('confirm-modal').classList.add('hidden');
  state.pendingDeleteId = null;
});
document.getElementById('btn-confirm-delete').addEventListener('click', deleteSchedule);
document.getElementById('confirm-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('confirm-modal')) {
    document.getElementById('confirm-modal').classList.add('hidden');
    state.pendingDeleteId = null;
  }
});

// Enter key in title field
document.getElementById('f-title').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') saveSchedule();
});

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
function init() {
  loadData();
  document.getElementById('f-date').value = getTodayStr();
  renderCards();
  renderCalendar();
}

init();
</script>
</body>
